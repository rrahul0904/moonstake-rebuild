<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Atlas 259 — Operator Console</title>
  <style>
    :root{color-scheme:dark;--bg:#070707;--panel:#111;--line:#2a2a2a;--text:#f3f1eb;--muted:#999;--soft:#181818;--danger:#ff8c8c;--ok:#b9f59d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1240px;margin:0 auto;padding:32px 22px 80px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:26px}.eyebrow{font:700 11px ui-monospace,monospace;letter-spacing:.15em;color:var(--muted)}h1{font-size:42px;letter-spacing:-.045em;margin:6px 0 0}.top a{color:var(--text);text-decoration:none;border:1px solid var(--line);padding:9px 12px;border-radius:10px}.status{border:1px solid var(--line);background:var(--panel);padding:13px 15px;border-radius:14px;margin-bottom:16px;color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px}.metric strong{display:block;font:700 22px ui-monospace,monospace}.metric span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.toolbar{display:flex;gap:8px;margin:18px 0}.toolbar input{flex:1;min-width:0;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px 12px;outline:none}.toolbar button,.actions button{border:1px solid var(--line);background:var(--soft);color:var(--text);padding:9px 11px;border-radius:9px;cursor:pointer}.toolbar button:hover,.actions button:hover{border-color:#555}.grid{display:grid;gap:10px}.claim{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.head{display:flex;justify-content:space-between;gap:14px}.brand{font-size:18px;font-weight:750}.meta,.ids{color:var(--muted);font:11px/1.5 ui-monospace,monospace;overflow-wrap:anywhere}.badge{font:700 10px ui-monospace,monospace;text-transform:uppercase;padding:5px 8px;border-radius:999px;border:1px solid var(--line);height:max-content}.badge.active{color:var(--ok)}.badge.hidden,.badge.refunded{color:var(--danger)}.copy{margin:10px 0;color:#c9c7c1}.sectors{font:11px/1.5 ui-monospace,monospace;color:#bbb;word-break:break-word}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}.actions button.danger{color:var(--danger)}.empty{padding:50px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.notice{color:var(--danger)}@media(max-width:700px){h1{font-size:31px}.top{align-items:flex-start;flex-direction:column}.summary{grid-template-columns:repeat(2,1fr)}.head{flex-direction:column}}
  </style>
</head>
<body>
<main class="shell">
  <div class="top"><div><div class="eyebrow">ATLAS 259 / OPERATIONS</div><h1>Operator console</h1></div><a href="/">← Registry</a></div>
  <div id="status" class="status">Checking administrator access…</div>
  <section id="summary" class="summary" hidden></section>
  <div class="toolbar"><button id="claims-tab">Claims</button><button id="users-tab">Users</button><button id="market-tab">Marketplace</button><input id="search" placeholder="Filter current view…"><button id="refresh">Refresh</button></div>
  <section id="claims" class="grid"></section>
  <section id="users" class="grid" hidden></section>
  <section id="market" class="grid" hidden></section>
</main>
<script type="module" src="/admin.js"></script>
</body>
</html>
