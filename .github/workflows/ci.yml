name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check src/server.mjs
      - run: node --check src/production-server.mjs
      - run: node --check src/supabase.mjs
      - run: node --check src/stripe.mjs
      - run: node --check public/app.js
